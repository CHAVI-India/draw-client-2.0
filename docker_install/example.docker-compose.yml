services:
  db:
    image: postgres:17
    container_name: draw-client-postgres-docker
    # Raise Postgres' default 100 connections so the web workers + Celery
    # worker + beat + retries don't exhaust it during pipeline execution.
    # Keep comfortably above the expected peak, not enormous.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
    ports:
      - "5433:5432" # External port for postgres may need to be changed.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: draw-client-rabbitmq-docker
    restart: unless-stopped
    ports:
      - "5675:5672" # External port for rabbitmq may need to be changed.
      - "15675:15672" # External port for rabbitmq management may need to be changed.
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  # One-shot migration container. It is the ONLY container that runs
  # collectstatic/migrate/createsuperuser, and it exits when done. The
  # long-running services below wait for it with
  # `condition: service_completed_successfully`, so Django never starts
  # against an un-migrated schema and three siblings never migrate at once.
  # Safe to re-run: `migrate` is a no-op when the schema is already current.
  migrate:
    image: public.ecr.aws/g0w3c0z2/draw-client-2.0:latest
    container_name: draw-client-migrate-docker
    command: ["./entrypoint.docker.sh", "migrate"]
    env_file:
      - .env
    environment:
      - DOCKER_CONTAINER=true
      - RUN_MIGRATIONS=true
      # Upper bound on waiting for the advisory lock in `migrate_locked`.
      - MIGRATE_LOCK_TIMEOUT=${MIGRATE_LOCK_TIMEOUT:-1800}
    volumes:
      - app_data:/app
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      - "dicomdata:/app/datastore"
      - ./certs:/usr/local/share/ca-certificates:ro
    depends_on:
      db:
        condition: service_healthy
    # One-shot by design: `up` runs it, it exits 0, then the services start.
    restart: "no"

  django-web:
    image: public.ecr.aws/g0w3c0z2/draw-client-2.0:latest
    container_name: draw-client-django-docker
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
      # Wait until the one-shot migrator has actually finished, not merely
      # started (service_started would let Django boot on a stale schema).
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "11112:11112"  # DICOM SCP port - for receiving DICOM files from modalities/PACS
    volumes:
      - app_data:/app
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles      
      - "dicomdata:/app/datastore"
      - ./certs:/usr/local/share/ca-certificates:ro
    command: ["./entrypoint.docker.sh"]
    restart: unless-stopped
    environment:
      - DOCKER_CONTAINER=true
      # Handled by the `migrate` service above; see entrypoint.docker.sh.
      - RUN_MIGRATIONS=false
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    #extra_hosts:
    #  - "ctkstore=<IPADDRESS>"

  celery:
    image: public.ecr.aws/g0w3c0z2/draw-client-2.0:latest
    container_name: draw-client-celery-docker
    command: ["./entrypoint.docker.sh", "celery"]
    volumes:
      - app_data:/app
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles      
      - "dicomdata:/app/datastore"
      - ./certs:/usr/local/share/ca-certificates:ro
    env_file:
      - .env
    environment:
      - DOCKER_CONTAINER=true
      # Cap Celery worker children (see entrypoint.docker.sh). Each worker
      # child holds a DB connection, so this keeps connections bounded.
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
      # Handled by the `migrate` service above; see entrypoint.docker.sh.
      - RUN_MIGRATIONS=false
    # Defense-in-depth: cap visible CPUs so an accidental concurrency default
    # can never spawn more workers/connections than Postgres allows.
    cpus: "2.0"
    restart: unless-stopped      
    depends_on:
      db:
        condition: service_healthy
      django-web:
        condition: service_started
      rabbitmq:
        condition: service_started
      # service_started on django-web is satisfied the instant that container
      # launches, long before its migrations would finish; the migrator's real
      # completion is what matters here.
      migrate:
        condition: service_completed_successfully
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  celery-beat:
    image: public.ecr.aws/g0w3c0z2/draw-client-2.0:latest
    container_name: draw-client-celery-beat-docker
    command: ["./entrypoint.docker.sh", "celery-beat"]
    volumes:
      - app_data:/app
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles      
      - "dicomdata:/app/datastore"
      - ./certs:/usr/local/share/ca-certificates:ro
    env_file:
      - .env
    environment:
      - DOCKER_CONTAINER=true
      # Handled by the `migrate` service above; see entrypoint.docker.sh.
      - RUN_MIGRATIONS=false
    depends_on:
      db:
        condition: service_healthy
      django-web:
        condition: service_started
      rabbitmq:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped    
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  memcached:
    image: 'memcached:latest'
    container_name: 'draw-client-memcached-docker'    
    volumes:
      - app_data:/app
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles      
      - "dicomdata:/app/datastore"
      - ./certs:/usr/local/share/ca-certificates:ro    
    restart: unless-stopped    
    ports:
      - "11212:11211" # External port for memcached may need to be changed.
  frontend-proxy:
    image: nginx:latest
    container_name: draw-client-nginx-docker
    restart: unless-stopped
    ports:
      - "8002:80" # Application will be available on port 8002 on the host.
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/staticfiles:ro
    depends_on:
      - django-web


